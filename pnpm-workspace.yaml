packages:
  - "packages/*"
  - "apps/*"

catalog:
  "@biomejs/biome": ^2.5.15
  "@changesets/cli": "^3.0.3"
  "@cloudflare/workers-types": ^5.20261107.1
  # ~1.4: pi-ai 1.5.0 dropped the `Type` export that @flue/runtime 2.3 imports.
  "@earendil-works/pi-agent-core": ~1.4.0
  "@earendil-works/pi-ai": ~1.4.0
  # Exact: the harness hosts Flue through its internal runtime APIs (statewalker/statewalker-root#128).
  "@flue/runtime": 2.3.0
  # The in-process CellB host the conformance suite runs deployments on; esbuild is its peer.
  "@statewalker/cellb": 0.8.8
  "@statewalker/webrun-biscuit": ^0.2.3
  "@statewalker/webrun-files": ^0.12.0
  "@statewalker/webrun-files-composite": ^0.12.0
  "@statewalker/webrun-files-mem": ^0.12.0
  "@statewalker/webrun-files-node": ^0.12.0
  "@statewalker/webrun-files-rpc": ^0.3.0
  "@statewalker/webrun-files-s3": ^0.12.0
  "@statewalker/webrun-files-sqlite": ^0.13.1
  "@statewalker/webrun-msgpack": ^0.15.0
  "@statewalker/webrun-streams-ws": ^0.5.3
  "@statewalker/db-api": ^0.1.7
  "@statewalker/db-sqlite-do": ^0.1.4
  # A Db over RPC with paged results and a read-only server (statewalker/statewalker-root#136).
  "@statewalker/db-rpc": ^0.1.0
  "@statewalker/db-sqlite": ^0.1.4
  "@aws-sdk/client-s3": 3.1155.0
  # gitignore-syntax matching for the ignore rules.
  ignore: ^7.0.5
  # The AI SDK: its own UI-message-stream parser checks the harness's projection (ai-conformance only).
  ai: 7.0.165
  zod: ^4.6.7
  # YAML front matter of agents and skills, and OpenAPI files written in YAML (ai-definitions).
  yaml: ^2.9.1
  # SigV4 for the S3 workspace backend's fetch-based client (ai-host-do).
  aws4fetch: ^1.0.20
  "@statewalker/webrun-rpc": ^0.16.0
  "@types/node": ^26.6.4
  # The conformance suite on CellB in Chromium: the browser it drives, and the bundler of its host page.
  playwright: ^1.63.0
  vite: ^8.3.2
  # The workbench's terminal (apps/workbench).
  "@xterm/addon-fit": ^0.11.0
  "@xterm/xterm": ^6.0.0
  esbuild: ^0.28.2
  # Property-based tests (the spec names it for ai-access).
  fast-check: 4.10.2
  just-bash: ^3.6.0
  tsdown: ^0.23.0
  tsx: ^4.23.15
  turbo: ^2.11.7
  typescript: ^7.0.2
  vitest: ^5.0.3

overrides:
  # @flue/runtime asks for pi-ai ^1.1.0; 1.5 breaks it (see the catalog).
  "@earendil-works/pi-ai": ~1.4.0
  "@earendil-works/pi-agent-core": ~1.4.0
  # Security fixes for transitive dependencies whose parents pin a vulnerable version; remove an
  # entry once its parent ships a release with the fixed version.
  # pi-ai → openai pins undici 7.x before the fixes.
  "undici@<7.30.1": ^7.30.1
  # @flue/runtime pins @modelcontextprotocol/client 2.0.0 (fixed in 2.3.0; the harness uses no MCP yet).
  "@modelcontextprotocol/client@<2.3.0": ^2.3.0
